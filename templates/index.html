<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Dashboard SNMP</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 900px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        .card h2 {
            margin-top: 0;
        }

        .valor {
            font-size: 18px;
            color: #333;
        }
    </style>
</head>

<body>

    <h1>Dashboard SNMP</h1>

    <div class="dashboard">

        <div class="card">
            <h2>Nome do equipamento</h2>
            <p class="valor">{{ dados["Nome"] }}</p>
        </div>

        <div class="card">
            <h2>Descrição</h2>
            <p class="valor">{{ dados["Descrição"] }}</p>
        </div>

        <div class="card">
            <h2>Tempo ligado</h2>
            <p class="valor">{{ dados["Tempo ligado"] }}</p>
        </div>

        <div class="card">
            <h2>Localização</h2>
            <p class="valor">{{ dados["Localização"] }}</p>
        </div>

        <div class="card">
            <h2>Contato</h2>
            <p class="valor">{{ dados["Contato"] }}</p>
        </div>

    </div>

</body>

</html>
